name: Check for Updates

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      copr_build:
        description: 'Ask COPR to build even if no new commit is pushed'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the remote head
        id: copr_before
        run: echo "head=$(git ls-remote origin HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Check for new libyal releases
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LIBS="libcerror libcthreads libcdata libclocale libcnotify libuna libcfile libcpath libbfio libfcache libfguid"
          CHANGES=""
          for lib in $LIBS; do
            LATEST=$(curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN}" --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors "https://api.github.com/repos/libyal/$lib/tags?per_page=1" | sed -n 's/.*"name": *"\([^"]*\)".*/\1/p')
            # Hard error: silently treating an API failure as "no change"
            # would skip this library while the run reports success.
            if [ -z "$LATEST" ]; then
              echo "ERROR: could not determine latest $lib tag from GitHub API" >&2
              exit 1
            fi
            # Extract version variable name (uppercase)
            VAR=$(echo "$lib" | tr '[:lower:]' '[:upper:]' | tr '-' '_')_VERSION
            CURRENT=$(sed -n "s/^${VAR} = //p" .copr/Makefile)
            echo "$lib: latest=$LATEST current=$CURRENT"
            if [ "$LATEST" != "$CURRENT" ]; then
              CHANGES="$CHANGES $lib:$VAR:$LATEST"
            fi
          done
          if [ -n "$CHANGES" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "updates=$CHANGES" >> "$GITHUB_OUTPUT"
          fi

      - name: Update and push
        if: steps.check.outputs.changes == 'true'
        env:
          # env indirection keeps the upstream-controlled tag names out of
          # shell interpolation (script-injection hardening)
          UPDATES: ${{ steps.check.outputs.updates }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          LATEST_DATE=0
          for update in $UPDATES; do
            LIB=$(echo "$update" | cut -d: -f1)
            VAR=$(echo "$update" | cut -d: -f2)
            VER=$(echo "$update" | cut -d: -f3)
            echo "Updating $LIB: $VAR = $VER"
            sed -i "s/^${VAR} = .*/${VAR} = ${VER}/" .copr/Makefile
            if [ "$VER" -gt "$LATEST_DATE" ] 2>/dev/null; then
              LATEST_DATE=$VER
            fi
          done
          if [ "$LATEST_DATE" -gt 0 ] 2>/dev/null; then
            sed -i "s/^BUNDLE_VERSION = .*/BUNDLE_VERSION = ${LATEST_DATE}/" .copr/Makefile
          fi
          git add .copr/Makefile
          git commit -m "Auto-update: libyal library versions"
          git push

      - name: Trigger COPR build
        # A pushed commit does not reach COPR by itself (this repo has no
        # COPR webhook), so ask COPR here and fail the run when that fails.
        if: always()
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
          BEFORE: ${{ steps.copr_before.outputs.head }}
          FORCE: ${{ inputs.copr_build }}
        run: |
          AFTER=$(git ls-remote origin HEAD | cut -f1)
          if [ -z "$BEFORE" ] || [ -z "$AFTER" ]; then
            echo "ERROR: could not read the remote head (before '$BEFORE', after '$AFTER')" >&2
            exit 1
          fi
          if [ "$AFTER" = "$BEFORE" ] && [ "$FORCE" != "true" ]; then
            echo "No new commit pushed; no COPR build needed"
            exit 0
          fi
          if [ -z "$COPR_WEBHOOK_URL" ]; then
            echo "ERROR: COPR_WEBHOOK_URL secret is not set; COPR was not asked to build $AFTER" >&2
            exit 1
          fi
          for pkg in libyal-bundle; do
            id=$(curl -fsS --retry 3 --max-time 60 -X POST "${COPR_WEBHOOK_URL%/}/$pkg/") || {
              echo "ERROR: COPR did not accept the build request for $pkg" >&2
              exit 1
            }
            echo "COPR build $id requested for $pkg"
          done

      - name: Verify CI configuration
        if: always()
        run: |
          LAST=$(git log -1 --format=%ct)
          THRESHOLD=$(( $(date +%s) - 3888000 ))
          if [ "$LAST" -lt "$THRESHOLD" ]; then
            git config user.name "GitHub Actions Bot"
            git config user.email "actions@github.com"
            git commit --allow-empty -m "ci: refresh workflow configuration"
            git push
          fi
